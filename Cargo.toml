[package]
name = "gpu"
version = "0.1.0"
edition = "2024"

[dependencies]
glam = "0.33.10"
image = "0.25.10"
vulkano = "0.35.2"
winit = "0.30.13"

[build-dependencies]
spirv-builder = "0.10.0-alpha.1"

[profile.dev]
opt-level = 1

# Compile build-dependencies in release mode with
# the same settings as regular dependencies.
[profile.release.build-override]
opt-level = 3
codegen-units = 16
[profile.dev.build-override]
opt-level = 3

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# DENY PANICS:
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
